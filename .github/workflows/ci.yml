name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate types
        run: npm run codegen

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:smoke

      # Architecture boundary check. Kept in ci.yml (not the deploy workflow)
      # because Shopify's auto-provisioned oxygen-deployment-*.yml has no
      # pre-deploy validation of its own; ci.yml + branch protection are the
      # safety net.
      - name: Validate architecture
        run: npx --yes @commerce-atoms/agents validate-architecture

